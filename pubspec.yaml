name: somali_caller
description: VoIP calling app with Somali captions
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  http: ^1.6.0
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.0.15
  flutter_sound: ^9.30.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
